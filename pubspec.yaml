name: qr_ai
description: "A new Flutter project for QR scanning and AI processing."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 1. مكتبة الكاميرا ومسح الـ QR (مستقرة وسريعة جداً)
  mobile_scanner: ^5.1.1

  # 2. مكتبة توليد الـ QR Code (لإنشاء كود QR جديد)
  qr_flutter: ^4.1.0

  # 3. مكتبة الذكاء الاصطناعي (Google Generative AI / Gemini)
  google_generative_ai: ^0.4.0

  # 4. مكتبة الهيستوري والتخزين المحلي
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  shared_preferences: ^2.2.2

  image_picker: ^1.1.2

  # 5. مكتبات مساعدة (لفتح الروابط والـ UI)
  url_launcher: ^6.3.0
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # مكتبات توليد كود الـ Hive للهيستوري
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

  # حزمة توليد الأيقونات
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/tr/